theme: "github.com/writeonlycode/hugo-agency-web"

languageCode: "en-us"

module:
  hugoVersion:
    min: "0.147.8"
  imports:
    - path: "github.com/writeonlycode/hugo-agency-web"

mounts:
  - source: "hugo_stats.json"
    target: "assets/notwatching/hugo_stats.json"
    disableWatch: true

  - source: "assets"
    target: "assets"

build:
  buildStats:
    enable: true

  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"

    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"

taxonomies:
  series: "series"
  tags: "tags"
